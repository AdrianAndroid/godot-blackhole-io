name: Deploy Web demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_RELEASE: 4.7.2-stable

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot engine and Web templates
        uses: actions/cache@v4
        with:
          path: |
            .godot-ci/engine
            .godot-ci/templates
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}-web-v1

      - name: Prepare Godot and non-threaded Web templates
        shell: bash
        run: |
          set -euo pipefail
          engine="$PWD/.godot-ci/engine/Godot_v${GODOT_RELEASE}_linux.x86_64"
          if [[ ! -x "$engine" ]]; then
            mkdir -p .godot-ci/downloads/engine .godot-ci/engine
            curl -fL --retry 3 -o .godot-ci/downloads/engine/godot.zip \
              "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
            unzip -q .godot-ci/downloads/engine/godot.zip -d .godot-ci/engine
            chmod +x "$engine"
          fi
          if [[ ! -f .godot-ci/templates/web_nothreads_release.zip ]]; then
            mkdir -p .godot-ci/downloads/templates .godot-ci/templates-unpacked .godot-ci/templates
            curl -fL --retry 3 -o .godot-ci/downloads/templates/templates.tpz \
              "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
            unzip -q .godot-ci/downloads/templates/templates.tpz -d .godot-ci/templates-unpacked
            cp .godot-ci/templates-unpacked/templates/web_*.zip .godot-ci/templates/
            cp .godot-ci/templates-unpacked/templates/version.txt .godot-ci/templates/
          fi
          template_home="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$template_home"
          cp .godot-ci/templates/*.zip .godot-ci/templates/version.txt "$template_home/"
          "$engine" --version

      - name: Import project resources
        shell: bash
        run: |
          set -euo pipefail
          engine="$PWD/.godot-ci/engine/Godot_v${GODOT_RELEASE}_linux.x86_64"
          "$engine" --headless --path "$GITHUB_WORKSPACE" --editor --quit

      - name: Export the Web demo
        shell: bash
        run: |
          set -euo pipefail
          engine="$PWD/.godot-ci/engine/Godot_v${GODOT_RELEASE}_linux.x86_64"
          mkdir -p build/web
          "$engine" --headless --path "$GITHUB_WORKSPACE" --export-release "Web / GitHub Pages" build/web/play.html
          cp web/index.html build/web/index.html
          python3 -I tools/patch_web_loader.py \
            --input build/web/play.html \
            --index build/web/index.html \
            --version "$GITHUB_SHA"
          python3 -I tools/patch_web_loader.py \
            --input build/web/play.html \
            --version "$GITHUB_SHA" \
            --check
          touch build/web/.nojekyll

      - name: Upload the Web demo for publishing
        uses: actions/upload-artifact@v4
        with:
          name: web-demo
          path: build/web
          include-hidden-files: true
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the static publishing branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Download the Web build
        uses: actions/download-artifact@v4
        with:
          name: web-demo
          path: /tmp/blackhole-web-demo

      - name: Publish only Web runtime files to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p /tmp/blackhole-web-retained
          for file in play.*.js play.*.pck play.*.wasm; do
            [[ "$file" =~ ^play\.[0-9a-f]{40}\.(js|pck|wasm)$ ]] || continue
            committed_at=$(git log -1 --format=%ct -- "$file")
            if [[ -n "$committed_at" ]] && (( $(date +%s) - committed_at < 86400 )); then
              cp "$file" /tmp/blackhole-web-retained/
            fi
          done
          git rm -rf --quiet .
          cp /tmp/blackhole-web-demo/*.html /tmp/blackhole-web-demo/*.js .
          cp /tmp/blackhole-web-demo/*.pck /tmp/blackhole-web-demo/*.wasm /tmp/blackhole-web-demo/*.png .
          cp /tmp/blackhole-web-demo/.nojekyll .
          for file in /tmp/blackhole-web-retained/play.*; do
            cp "$file" .
          done
          git add --all
          if git diff --cached --quiet; then
            echo "No Web demo changes to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "deploy: publish Web demo ${GITHUB_SHA}"
          git push origin HEAD:gh-pages
